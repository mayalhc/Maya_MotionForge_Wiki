# 사이트 설정
site_name: MotionForge for Maya — User Guide
site_url: https://mayalhc.github.io/Maya_MotionForge_Wiki/
site_author: chamiseul

# 테마 설정
theme:
  name: readthedocs
  highlightjs: true
  collapse_navigation: false # 전체를 항상 펼침
  sticky_navigation: true
  navigation_depth: 4
  titles_only: false

extra_css:
  - custom.css

# 네비게이션 (메뉴 구조)
nav:
  - MotionForge for Maya Guide:
    - "Welcome to MotionForge for Maya": index.md # 상위 메뉴 클릭 시 바로 보일 파일
    - "한국어 가이드": KO_index.md
    - "Release Notes": RELEASE_NOTES.md
    - "릴리즈 노트": KO_RELEASE_NOTES.md
    - "All add-ons & guides": https://mayalhc.github.io/GroomForge-Wiki/

# 마크다운 확장 기능
markdown_extensions:
  - admonition # 경고/정보 박스 생성
  - tables # 표 지원
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search # 검색창 기능
